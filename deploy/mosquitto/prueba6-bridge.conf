# Mosquitto bridge config for prueba6
# Bridges topics under esp32s3/# to multiple public brokers to reduce data loss.

connection prueba6_to_public_1
address 54.36.178.49:1883
topic esp32s3/# out 0
topic esp32s3/# in 0
try_private false
start_type automatic
notifications true

connection prueba6_to_public_2
address test.mosquitto.org:1883
topic esp32s3/# out 0
topic esp32s3/# in 0
try_private false
start_type automatic
notifications true

# Optional: tune keepalive and reconnect
# Use a shorter keepalive to detect dead peers faster and prefer the
# broker that previously worked better (test.mosquitto.org).
keepalive_interval 30
bridge_attempt_unsubscribe false
